<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182e25"><title>GrowLab – Die grüne Lizenz</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f0f3e7;background:#12231c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(#203c2f,#12231c)}button,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.42;cursor:default}.app{max-width:600px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;background:#182e25ee;backdrop-filter:blur(10px);padding:12px 16px;border-bottom:2px solid #42644d;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.4px;font-size:19px;color:#bce49b}.sub{font-size:12px;color:#b4c5b3}.money{text-align:right;font-weight:800;color:#f8d980}.wrap{padding:14px}.panel{background:#263e31;border:2px solid #4a6b50;border-radius:15px;padding:14px;margin-bottom:13px;box-shadow:0 4px 0 #10251a}.panel h2,.panel h3{margin:0 0 9px;font-size:18px}.panel p{color:#d1dfcb;line-height:1.45;margin:6px 0 10px;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.muted{color:#a9c2a9;font-size:12px}.tag{background:#395b43;color:#d4f4c7;border-radius:30px;padding:4px 8px;font-size:11px;display:inline-block}.btn{background:#a5d47a;color:#19301d;border:2px solid #d0ed9f;border-radius:10px;padding:10px 12px;font-weight:800;min-height:42px}.btn.alt{background:#355941;color:#edf5e5;border-color:#688b69}.btn.warn{background:#a85c4c;color:white;border-color:#e28c6e}.btn.small{padding:7px 10px;min-height:35px;font-size:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#182e25;border-top:2px solid #537456;padding:8px max(6px,calc((100vw - 600px)/2)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.tab{color:#b9cfb6;background:transparent;min-width:20%;font-size:10px;padding:5px 0}.tab .emoji{display:block;font-size:22px;margin-bottom:2px}.tab.active{color:#dcffac;font-weight:800}.garden{position:relative;overflow:hidden;border:4px solid #876747;border-radius:12px;background:repeating-linear-gradient(0deg,#8a6a4b 0 23px,#78583d 24px 26px);padding:22px 12px;box-shadow:inset 0 0 0 5px #a78658}.garden:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 75px,#654b3530 76px 78px)}.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;position:relative}.pot{min-height:112px;background:#315c40dd;border:3px solid #668c5c;border-radius:12px;color:#f5ffe9;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;padding:5px;box-shadow:0 5px 0 #433e2e}.pot.locked{filter:grayscale(.7);opacity:.75}.plant-art{font-size:37px;filter:drop-shadow(2px 3px 0 #172d20)}.pot-name{font-size:10px;text-align:center;font-weight:700}.meter{height:9px;border-radius:9px;background:#172b22;overflow:hidden;flex:1;min-width:40px}.fill{height:100%;background:#99d777}.stat{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}.stat span:first-child{min-width:76px}.item{padding:12px 0;border-top:1px solid #4d6d51}.item:first-of-type{border-top:0}.notice{background:#3d5238;border-left:4px solid #b9d97d;padding:9px 11px;border-radius:7px;font-size:13px;line-height:1.4}.navtitle{font-size:23px;margin:3px 0 14px}.hide{display:none!important}select{background:#162e23;color:white;border:1px solid #72946b;padding:10px;border-radius:9px;width:100%;margin:5px 0 10px}.overlay{position:fixed;inset:0;background:#07120bbd;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#263e31;border:2px solid #75966b;border-radius:20px 20px 0 0;padding:20px;width:min(600px,100%);max-height:85dvh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 7px}.tiny{font-size:11px;color:#c3d6b8}.divider{height:1px;background:#49644b;margin:12px 0}.pill{background:#1c3327;padding:6px 9px;border-radius:8px;font-size:12px}.log{font-size:12px;color:#d7e9d1;padding:7px 0;border-bottom:1px solid #48614b}.logo{font-size:29px}.intro{background:#344f3b;border-radius:12px;padding:12px;margin-bottom:12px} @media(min-width:700px){.tabs{max-width:600px;margin:auto;border-left:2px solid #537456;border-right:2px solid #537456}.app{border-left:1px solid #3c5b44;border-right:1px solid #3c5b44}}
</style></head><body><div id="app"><main style="font-family:system-ui;padding:24px;max-width:550px;margin:auto;color:#f4f7ed;background:#182e25;min-height:100vh"><h1>🌿 GrowLab</h1><p>Das Spiel konnte in dieser Vorschau noch nicht gestartet werden.</p><p>Wenn dieser Hinweis stehen bleibt, führt die App, mit der du die HTML-Datei geöffnet hast, möglicherweise kein JavaScript aus. Öffne GrowLab über eine gehostete HTTPS-Webseite in Safari.</p><p id="startup-status">Initialisierung läuft …</p></main></div><script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a)a.innerHTML='<main style="font-family:system-ui;padding:24px;background:#182e25;color:white;min-height:100vh"><h1>GrowLab – Startfehler</h1><p>Beim Laden ist ein Fehler aufgetreten:</p><pre style="white-space:pre-wrap">'+String(e.message||'Unbekannter Fehler').replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x]})+'</pre></main>';});

'use strict';const KEY='growlab_v1_save';const strains={northern:{name:'Northern Lights',type:'Indica-dominant',yield:5,aroma:64,robust:84,days:8,price:52},blueberry:{name:'Blueberry',type:'Indica-dominanter Hybrid',yield:4,aroma:87,robust:68,days:9,price:68},skunk:{name:'Skunk #1',type:'Hybrid',yield:6,aroma:65,robust:80,days:8,price:48},haze:{name:'Haze',type:'Sativa-dominant',yield:5,aroma:78,robust:60,days:11,price:72}};const newState=()=>({day:1,time:8,energy:100,coins:500,slots:2,plants:[{id:1,strain:'northern',age:0,health:95,water:72},{id:2,strain:'blueberry',age:0,health:95,water:72}],stock:{},seeds:{northern:2,blueberry:1,skunk:1,haze:0},research:0,hybrids:[],projects:[],completed:0,history:[],log:['Du hast die alte Gärtnerei in Greenhaven übernommen.'],nextId:3,tab:'grow',intro:true});let s;try{s=JSON.parse(localStorage.getItem(KEY))||newState();if(!s.plants||!s.seeds)throw Error()}catch(e){s=newState()}let modal=null;const $=id=>document.getElementById(id);const money=n=>Math.round(n).toLocaleString('de-DE');const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const plantStr=p=>strains[p.strain]||p.custom;const cost=(n)=>{if(s.coins<n){toast('Nicht genügend GreenCoins.');return false}s.coins-=n;return true};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};const msg=t=>{s.log.unshift('Tag '+s.day+': '+t);s.log=s.log.slice(0,35)};const toast=t=>{modal={type:'info',text:t};render()};const btn=(text,act,cls='',disabled=false)=>`<button class="btn ${cls}" ${disabled?'disabled':''} onclick="act('${act}')">${text}</button>`;const meter=(name,n)=>`<div class="stat"><span>${name}</span><div class="meter"><div class="fill" style="width:${clamp(n,0,100)}%"></div></div><b>${Math.round(n)}%</b></div>`;const stage=p=>{let f=p.age/plantStr(p).days;return f>=1?'Erntereif':f>.7?'Blüte':f>.35?'Wachstum':'Jungpflanze'};const art=p=>p.age>=plantStr(p).days?'🌼':p.age>plantStr(p).days*.7?'🌿':p.age>plantStr(p).days*.35?'🪴':'🌱';const title=t=>`<h1 class="navtitle">${t}</h1>`;
function grow(){let html=title('🌿 Deine Gärtnerei')+`<div class="panel"><div class="row"><b>Growroom A</b><span class="tag">${s.plants.length}/${s.slots} Plätze</span></div><p>Tippe auf eine Pflanze, um sie zu pflegen oder zu ernten.</p><div class="garden"><div class="pots">`;for(let i=0;i<Math.max(4,s.slots);i++){let p=s.plants[i];html+=p?`<button class="pot" onclick="openPlant(${p.id})"><span class="plant-art">${art(p)}</span><span class="pot-name">${plantStr(p).name}</span><span class="tiny">${stage(p)} · ${p.age}/${plantStr(p).days} T</span></button>`:i<s.slots?`<button class="pot" onclick="openPlant(0)"><span class="plant-art">➕</span><span class="pot-name">Samen pflanzen</span></button>`:`<button class="pot locked" onclick="act('upgrade')"><span class="plant-art">🔒</span><span class="pot-name">Ausbauen</span></button>`}html+=`</div></div></div><div class="panel"><div class="row"><h3>Dein Spieltag</h3><span class="tag">⚡ ${s.energy}/100</span></div><p>Die Zeit läuft nur durch deine Aktionen weiter. Schlafen startet den nächsten Spieltag.</p><div class="btnrow">${btn('🌙 Tag beenden','sleep')}${btn('🛠 Platz erweitern · '+(250+(s.slots-2)*200)+' GC','upgrade','alt',s.slots>=12)}</div></div>`;return html}
function genetics(){let html=title('🧬 Genetiklabor')+`<div class="panel"><div class="row"><h3>Forschung</h3><span class="tag">${s.research} FP</span></div><p>Kreuze zwei verschiedene Elternlinien. Ein Projekt dauert drei Spieltage und liefert je nach Platz und Budget bis zu drei Kandidaten.</p><label class="muted">Elternlinie A</label><select id="parentA">${Object.entries(strains).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><label class="muted">Elternlinie B</label><select id="parentB">${Object.entries(strains).map(([k,v],i)=>`<option value="${k}" ${i===1?'selected':''}>${v.name}</option>`).join('')}</select>${btn('Projekt starten · 120 GC','cross','',s.projects.length>=2)}<p class="tiny">Für diese erste Version sind die vier Ausgangslinien im Labor als Forschungsreferenzen verfügbar. Die Nachkommenzahl richtet sich nach freien Laborplätzen und dem Budget.</p></div>`;if(s.projects.length){html+=`<div class="panel"><h3>Aktive Projekte</h3>${s.projects.map(p=>`<div class="item"><b>${strains[p.a].name} × ${strains[p.b].name}</b><p>Noch ${p.left} Spieltage · ${p.count} Kandidat(en)</p></div>`).join('')}</div>`}html+=`<div class="panel"><h3>Sortenlexikon</h3>${Object.entries(strains).map(([k,v])=>`<div class="item"><div class="row"><b>${v.name}</b><span class="tag">${v.type}</span></div><p>Ertrag ${v.yield} · Aroma ${v.aroma}/100 · Robustheit ${v.robust}/100</p></div>`).join('')}</div><div class="panel"><h3>Deine Hybridlinien (${s.hybrids.length})</h3>${s.hybrids.length?s.hybrids.map(h=>`<div class="item"><b>${h.name}</b> <span class="tag">Hybrid · F1</span><p>${h.parents} · Qualität ${h.quality}/100 · Robustheit ${h.robust}/100</p></div>`).join(''):'<p>Noch keine eigenen Linien. Schließe ein Forschungsprojekt ab.</p>'}</div>`;return html}
function production(){return title('🏭 Produktion')+`<div class="panel"><h3>Manufaktur</h3><p>Die Manufaktur wird in einer späteren Entwicklungsstufe freigeschaltet. Hier entstehen dann abstrakte Produktketten mit eigenen Kosten, Produktionszeiten und Verkaufspreisen.</p><div class="notice">🔧 Geplant: Verarbeitung, Verpackung, Maschinen-Upgrades und später automatische Produktionskräfte.</div></div><div class="panel"><h3>Ausbaupfad</h3><p>1. Gärtnerei → 2. Separate Grow-Zelte → 3. Manufaktur → 4. Produktionshalle.</p></div>`}
function trade(){let rows=Object.entries(s.stock).filter(([k,n])=>n>0);return title('🏪 Handelsbüro')+`<div class="panel"><div class="row"><h3>Deine Finanzen</h3><span class="tag">${money(s.coins)} GC</span></div><p>Eine einfache Übersicht ohne komplizierte Buchhaltung.</p><div class="row"><span>Letzter Tagesabschluss</span><b>${s.history.length?(s.history[0].net>=0?'+':'')+money(s.history[0].net)+' GC':'Noch keiner'}</b></div><div class="divider"></div><div class="muted">${s.history.slice(0,7).map(h=>`Tag ${h.day}: ${h.net>=0?'+':''}${money(h.net)} GC`).join(' · ')||'Die Tagesübersicht erscheint nach dem ersten Schlafen.'}</div></div><div class="panel"><h3>Ernte verkaufen</h3>${rows.length?rows.map(([key,n])=>{let st=strains[key]||s.hybrids.find(h=>h.key===key);return `<div class="item"><div class="row"><div><b>${st?.name||key}</b><div class="muted">${n} Einheiten · ${st?.price||75} GC / Einheit</div></div>${btn('Verkaufen','sell:'+key,'small')}</div></div>`}).join(''):'<p>Dein Lager enthält noch keine verkaufbare Ernte.</p>'}</div><div class="panel"><h3>Saatguthandel</h3>${Object.entries(strains).map(([key,v])=>`<div class="item"><div class="row"><div><b>${v.name}</b><div class="muted">${v.type} · 45 GC/Samen</div></div>${btn('Kaufen','buy:'+key,'small',s.coins<45)}</div></div>`).join('')}</div>`}
function storage(){return title('📦 Lager & Tagebuch')+`<div class="panel"><h3>Samenbank</h3>${Object.entries(s.seeds).map(([k,n])=>`<div class="item row"><span>${strains[k]?.name||k}</span><b>${n} Samen</b></div>`).join('')}</div><div class="panel"><h3>Erntebestand</h3>${Object.entries(s.stock).filter(([k,n])=>n>0).map(([k,n])=>`<div class="item row"><span>${strains[k]?.name||s.hybrids.find(h=>h.key===k)?.name||k}</span><b>${n} Einheiten</b></div>`).join('')||'<p>Das Lager ist leer.</p>'}</div><div class="panel"><h3>Spielereignisse</h3>${s.log.slice(0,12).map(x=>`<div class="log">${x}</div>`).join('')}</div><div class="panel"><h3>Spielstand</h3><p>Automatische Speicherung auf diesem Gerät nach jeder Aktion.</p><div class="btnrow">${btn('Spielstand exportieren','export','alt')}${btn('Neues Spiel','reset','warn')}</div></div>`}
function render(){save();let pages={grow,genetics,production,trade,storage};$('app').innerHTML=`<main class="app"><header class="top"><div><div class="brand">🌿 GrowLab</div><div class="sub">Tag ${s.day} · ${String(Math.floor(s.time)).padStart(2,'0')}:${s.time%1?'30':'00'} Uhr · ⚡ ${s.energy}/100</div></div><div class="money">🪙 ${money(s.coins)} GC<div class="sub">Die grüne Lizenz</div></div></header><div class="wrap">${pages[s.tab]()}</div></main><nav class="tabs">${[['grow','🌱','Anbau'],['genetics','🧬','Genetik'],['production','🏭','Produktion'],['trade','🏪','Handel'],['storage','📦','Lager']].map(([id,emoji,name])=>`<button class="tab ${s.tab===id?'active':''}" onclick="tab('${id}')"><span class="emoji">${emoji}</span>${name}</button>`).join('')}</nav>${modal?modalHtml():''}`}
function modalHtml(){let m=modal;if(m.type==='info')return `<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><p>${m.text}</p>${btn('Verstanden','close')}</div></div>`;if(m.type==='plant'){let p=s.plants.find(p=>p.id===m.id);if(!p)return `<div class="overlay"><div class="sheet"><h2>Neuen Samen pflanzen</h2><p>Wähle eine Sorte aus deiner Samenbank.</p>${Object.entries(s.seeds).filter(([k,n])=>n>0).map(([k,n])=>`<div class="item row"><div><b>${strains[k].name}</b><div class="muted">${strains[k].type} · ${n} Samen</div></div>${btn('Pflanzen','plant:'+k,'small',s.energy<8)}</div>`).join('')||'<p>Keine Samen vorhanden. Im Handelsbüro kannst du neue kaufen.</p>'}${btn('Schließen','close','alt')}</div></div>`;let st=plantStr(p),ready=p.age>=st.days;return `<div class="overlay"><div class="sheet"><div class="row"><h2>${art(p)} ${st.name}</h2><span class="tag">${st.type}</span></div><p>${stage(p)} · Tag ${p.age} von ${st.days}</p>${meter('Gesundheit',p.health)}${meter('Versorgung',p.water)}${meter('Fortschritt',p.age/st.days*100)}<p>Die Pflege ist bewusst abstrahiert. Eine Aktion verbessert die Versorgung und kostet 5 Energie.</p><div class="btnrow">${btn('💧 Pflegen · 5 ⚡','care:'+p.id,'',s.energy<5||ready)}${btn('🌾 Ernten · 12 ⚡','harvest:'+p.id,'',!ready||s.energy<12)}${btn('Schließen','close','alt')}</div></div></div>`}if(m.type==='candidates'){return `<div class="overlay"><div class="sheet"><h2>🧬 Forschungsabschluss</h2><p>${m.parents} – ${m.options.length} Kandidat(en). Wähle einen Nachkommen für dein Archiv. Andere Kandidaten werden verworfen.</p>${m.options.map((c,i)=>`<div class="item"><div class="row"><b>Kandidat ${i+1}</b><span class="tag">Hybrid · F1</span></div>${meter('Ertrag',c.yield)}${meter('Aroma',c.aroma)}${meter('Robustheit',c.robust)}${btn('Diese Linie behalten','choose:'+i,'small')}</div>`).join('')}</div></div>`}return ''}
function tab(t){s.tab=t;modal=null;render()}function closeModal(){modal=null;render()}function openPlant(id){modal={type:'plant',id};render()}function spendEnergy(n){if(s.energy<n){toast('Dafür reicht deine Energie heute nicht. Beende den Tag und schlafe.');return false}s.energy-=n;s.time=Math.min(22,s.time+.5);return true}
function act(a){if(a==='close'){closeModal();return}if(a==='sleep'){let before=s.coins;let upkeep=0;s.plants.forEach(p=>{p.age++;p.water=clamp(p.water-12,0,100);if(p.water<20)p.health=clamp(p.health-5,35,100);else if(p.water>=35)p.health=clamp(p.health+1,0,100)});s.projects.forEach(p=>p.left--);let done=s.projects.filter(p=>p.left<=0);s.projects=s.projects.filter(p=>p.left>0);s.coins-=upkeep;s.history.unshift({day:s.day,net:s.coins-before});s.history=s.history.slice(0,7);s.day++;s.time=8;s.energy=100;msg('Ein neuer Tag beginnt. Pflanzen und Forschungsprojekte sind vorangeschritten.');if(done.length){let p=done[0],A=strains[p.a],B=strains[p.b];modal={type:'candidates',parents:A.name+' × '+B.name,options:Array.from({length:p.count},()=>({yield:clamp(Math.round((A.yield+B.yield)*8+Math.random()*25-13),25,100),aroma:clamp(Math.round((A.aroma+B.aroma)/2+Math.random()*31-15),20,100),robust:clamp(Math.round((A.robust+B.robust)/2+Math.random()*31-15),20,100)}))};s.pendingResults=done.slice(1);s.currentParents=modal.parents;s.research+=35;msg('Ein Genetikprojekt wurde abgeschlossen.')}else{modal={type:'info',text:`🌅 Tag ${s.day} beginnt! Energie aufgefüllt. Deine Pflanzen sind einen Tag gewachsen.`}}render();return}if(a==='upgrade'){let c=250+(s.slots-2)*200;if(s.slots>=12)return toast('Die Gärtnerei ist voll. Die große Halle folgt in einem späteren Update.');if(!cost(c))return;s.slots++;msg('Ein neuer Pflanzenplatz wurde freigeschaltet.');render();return}if(a.startsWith('care:')){let p=s.plants.find(x=>x.id===+a.split(':')[1]);if(!p||!spendEnergy(5))return;p.water=clamp(p.water+32,0,100);p.health=clamp(p.health+3,0,100);msg(plantStr(p).name+' wurde gepflegt.');modal={type:'plant',id:p.id};render();return}if(a.startsWith('plant:')){if(s.plants.length>=s.slots)return toast('Kein freier Pflanzenplatz.');let k=a.split(':')[1];if(!s.seeds[k]||!spendEnergy(8))return;s.seeds[k]--;s.plants.push({id:s.nextId++,strain:k,age:0,health:95,water:75});msg(strains[k].name+' wurde gepflanzt.');modal=null;render();return}if(a.startsWith('harvest:')){let id=+a.split(':')[1],p=s.plants.find(x=>x.id===id);if(!p||p.age<plantStr(p).days||!spendEnergy(12))return;let st=plantStr(p),n=Math.max(1,Math.round(st.yield*p.health/100));s.stock[p.strain]=(s.stock[p.strain]||0)+n;s.plants=s.plants.filter(x=>x.id!==id);s.completed++;msg(st.name+' geerntet: '+n+' Einheiten.');modal={type:'info',text:`🌾 Ernte abgeschlossen: ${n} Einheiten ${st.name} liegen im Lager.`};render();return}if(a.startsWith('buy:')){let k=a.split(':')[1];if(!cost(45))return;s.seeds[k]=(s.seeds[k]||0)+1;msg('Saatgut gekauft: '+strains[k].name);render();return}if(a.startsWith('sell:')){let k=a.split(':')[1],n=s.stock[k]||0;if(!n)return;let st=strains[k]||s.hybrids.find(h=>h.key===k),value=n*(st?.price||75);s.coins+=value;s.stock[k]=0;msg(n+' Einheiten '+st.name+' für '+money(value)+' GC verkauft.');render();return}if(a==='cross'){let A=$('parentA').value,B=$('parentB').value;if(A===B)return toast('Bitte wähle zwei verschiedene Elternlinien.');if(s.projects.length>=2)return toast('Alle Forschungsplätze sind belegt.');let free=3-s.projects.length,affordable=Math.floor(s.coins/120),count=Math.min(3,free,affordable);if(count<1)return toast('Für dieses Forschungsprojekt benötigst du mindestens 120 GC.');if(!cost(count*120))return;s.projects.push({a:A,b:B,count,left:3});msg('Kreuzung '+strains[A].name+' × '+strains[B].name+' gestartet ('+count+' Kandidaten).');toast('Forschung gestartet! Nach drei Spieltagen kannst du bis zu '+count+' Kandidaten vergleichen.');return}if(a.startsWith('choose:')){let c=modal.options[+a.split(':')[1]],id=s.hybrids.length+1;let h={...c,key:'hybrid'+id,name:'Greenhaven Hybrid '+id,parents:s.currentParents,type:'Hybrid',quality:Math.round((c.aroma+c.robust+c.yield)/3),price:85};s.hybrids.push(h);s.research+=20;msg('Neue Hybridlinie archiviert: '+h.name);modal={type:'info',text:`🧬 ${h.name} wurde im Genetikbuch archiviert. Die Linie besitzt einen dokumentierten Stammbaum und eigene Spielwerte.`};render();return}if(a==='reset'){if(confirm('Wirklich alle lokalen GrowLab-Spielstände löschen und neu anfangen?')){s=newState();modal=null;render()}return}if(a==='export'){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='growlab-spielstand.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);return}}
window.act=act;window.tab=tab;window.openPlant=openPlant;window.closeModal=closeModal;if(s.intro){s.intro=false;modal={type:'info',text:'🌿 Willkommen bei GrowLab – Die grüne Lizenz! Du erbst eine kleine Gärtnerei in Greenhaven. Pflege deine Pflanzen, beende Spieltage durch Schlafen, ernte und verkaufe deine Ware. Alle Spielstände werden automatisch auf diesem Gerät gespeichert.'}}render();
</script></body></html>
